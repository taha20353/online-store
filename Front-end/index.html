<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Store</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- CART SIDE PANEL -->
  <div id="cartOverlay" class="cart-overlay" onclick="closeCart()"></div>
  <div id="cartPanel" class="cart-panel">
    <div class="cart-panel-header">
      <h3>🛒 Your Cart</h3>
      <button onclick="closeCart()" class="close-btn">✕</button>
    </div>
    <div id="panelCartItems" class="panel-cart-items">
      Loading...
    </div>
    <div id="panelCartFooter" class="panel-cart-footer"></div>
  </div>

  <!-- NAVBAR -->
  <nav>
    <a href="index.html" class="logo">🛒 Online Store</a>
    <div class="nav-links">
      <a href="index.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="orders.html">Orders</a>
      <a href="login.html" id="loginLink">Login</a>
      <a href="#" id="logoutLink" style="display:none;">Logout</a>
    </div>
    <!-- Hamburger for mobile -->
    <button class="hamburger" id="hamburger" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Mobile menu -->
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="orders.html">Orders</a>
      <a href="login.html" id="mobileLoginLink">Login</a>
      <a href="#" id="mobileLogoutLink" style="display:none;">Logout</a>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="container">
    <h2 class="page-title">All Products</h2>
    <div class="products-grid" id="productsGrid">
      <p>Loading products...</p>
    </div>
  </div>

<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    console.log('Token:', localStorage.getItem('token'));
    console.log('isLoggedIn:', isLoggedIn());

    // Desktop navbar
    if (isLoggedIn()) {
      document.getElementById('loginLink').style.display = 'none';
      document.getElementById('logoutLink').style.display = 'inline';
    }

    // Mobile menu
    if (isLoggedIn()) {
      const mobileLogin = document.getElementById('mobileLoginLink');
      const mobileLogout = document.getElementById('mobileLogoutLink');
      if (mobileLogin) mobileLogin.style.display = 'none';
      if (mobileLogout) mobileLogout.style.display = 'block';
    }

    // Desktop logout
    document.getElementById('logoutLink')?.addEventListener('click', () => {
      removeToken();
      window.location.href = 'login.html';
    });

    // Mobile logout
    document.getElementById('mobileLogoutLink')?.addEventListener('click', () => {
      removeToken();
      window.location.href = 'login.html';
    });

    const toggleMenu = () => {
      document.getElementById('hamburger').classList.toggle('open');
      document.getElementById('mobileMenu').classList.toggle('open');
    };

    // Make toggleMenu global
    window.toggleMenu = toggleMenu;
  });
</script>

</body>

</html>
