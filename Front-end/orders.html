<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <a href="index.html" class="logo">🛒 Online Store</a>
    <div class="nav-links">
      <a href="index.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="orders.html">Orders</a>

      <!-- Not logged in -->
      <a href="login.html" id="loginLink" class="nav-login-btn">Login</a>

      <!-- Logged in — avatar dropdown -->
      <div class="nav-avatar-wrap" id="avatarWrap" style="display:none;">
        <div class="nav-avatar" id="navAvatar" onclick="toggleDropdown()">T</div>
        <div class="nav-dropdown" id="navDropdown">
          <div class="nav-dropdown-header">
            <div class="dropdown-avatar" id="dropdownAvatar">T</div>
            <div>
              <div class="dropdown-name" id="dropdownName">User</div>
              <div class="dropdown-email" id="dropdownEmail"></div>
            </div>
          </div>
          <div class="nav-dropdown-divider"></div>
          <a href="profile.html" class="nav-dropdown-item">👤 My Profile</a>
          <a href="orders.html" class="nav-dropdown-item">📦 My Orders</a>
          <a href="cart.html" class="nav-dropdown-item">🛒 My Cart</a>
          <div class="nav-dropdown-divider"></div>
          <a href="admin/index.html" class="nav-dropdown-item admin-item" id="adminLink" style="display:none;">⚙️ Admin
            Panel</a>
          <button class="nav-dropdown-item logout-item" onclick="handleLogout()">🚪 Logout</button>
        </div>
      </div>
    </div>

    <!-- Hamburger for mobile -->
    <button class="hamburger" id="hamburger" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Mobile menu -->
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="orders.html">Orders</a>
      <a href="login.html" id="mobileLoginLink">Login</a>
      <a href="#" id="mobileLogoutLink" style="display:none;">Logout</a>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="container">
    <h2 class="page-title">📦 Your Orders</h2>
    <div id="ordersList">Loading...</div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.href = 'login.html';
    }

    if (isLoggedIn()) {
      document.getElementById('loginLink').style.display = 'none';
      document.getElementById('logoutLink').style.display = 'inline';
    }

    document.getElementById('logoutLink').addEventListener('click', () => {
      removeToken();
      window.location.href = 'login.html';
    });
    const toggleMenu = () => {
      document.getElementById('hamburger').classList.toggle('open');
      document.getElementById('mobileMenu').classList.toggle('open');
    };
  </script>

</body>

</html>
