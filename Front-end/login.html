<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <a href="index.html" class="logo">🛒 Online Store</a>
    <div class="nav-links">
      <a href="index.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="orders.html">Orders</a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <!-- FORM -->
  <div class="form-container">
    <h2>Login</h2>
    <div id="message"></div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" />
    </div>

    <button class="btn btn-primary" onclick="handleLogin()">Login</button>
    <div style="text-align:center; margin-top:15px;">
      <p style="color:#aaa; margin-bottom:10px;">or</p>
      <a href="https://online-store-rq6j.onrender.com/auth/google" class="google-btn">
        <img src="https://developers.google.com/identity/images/g-logo.png" width="20" height="20" />
        Sign in with Google
      </a>
    </div>

    <p>Don't have an account? <a href="register.html">Register</a></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

</body>

</html>
