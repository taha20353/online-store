<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Products</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>

  <!-- ADMIN NAVBAR -->
  <nav>
    <a href="index.html" class="logo">⚙️ Admin Panel</a>
    <div class="nav-links">
      <a href="index.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="orders.html">Orders</a>
      <a href="../index.html">← Store</a>
      <a href="#" id="logoutLink">Logout</a>
    </div>
  </nav>

  <div class="container">
    <h2 class="page-title">🛍️ Manage Products</h2>

    <!-- ADD PRODUCT FORM -->
    <div class="admin-form">
      <h3 id="formTitle">➕ Add New Product</h3>
      <input type="hidden" id="editProductId" />
      <div class="form-row">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="productName" placeholder="Enter product name" />
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="productCategory"></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Price</label>
          <input type="number" id="productPrice" placeholder="0.00" step="0.01" />
        </div>
        <div class="form-group">
          <label>Stock</label>
          <input type="number" id="productStock" placeholder="0" />
        </div>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="productDescription" placeholder="Enter product description"></textarea>
      </div>
      <div class="form-group">
        <label>Image URL</label>
        <input type="text" id="productImage" placeholder="https://..." />
      </div>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn btn-primary" style="width:auto;" onclick="saveProduct()">
          💾 Save Product
        </button>
        <button class="btn btn-danger" style="width:auto; display:none;"
          id="cancelEdit" onclick="cancelEdit()">
          Cancel
        </button>
      </div>
      <div id="productMessage"></div>
    </div>

    <!-- PRODUCTS TABLE -->
    <div id="productsTable">Loading...</div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/admin/products.js"></script>
  <script>
    if (!isLoggedIn()) window.location.href = '../login.html';

    document.getElementById('logoutLink').addEventListener('click', () => {
      removeToken();
      window.location.href = '../login.html';
    });
  </script>

</body>
</html>
